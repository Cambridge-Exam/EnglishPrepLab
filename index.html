```html
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Login — EnglishPrepLab</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #1f2937;
    }

    .login-box {
      width: min(90%, 420px);
      padding: 40px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 10px;
      font-size: 0.85rem;
      color: #64748b;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 1.8rem;
    }

    p {
      line-height: 1.5;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 18px 0 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 1rem;
    }

    button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 6px;
      background: #1f2937;
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #error {
      min-height: 24px;
      margin-top: 12px;
      color: #b91c1c;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>

  <main class="login-box">
    <p class="eyebrow">EnglishPrepLab · Student Version</p>

    <h1>Student Login</h1>

    <p>
      Enter your password to access the diagnostic test.
    </p>

    <form id="login-form">
      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        name="password"
        autocomplete="off"
        required
        autofocus
      >

      <button type="submit">Enter</button>

      <p id="error" role="alert"></p>
    </form>
  </main>

  <script>
    /*
      Student access password.
      Replace this value with your own password.
    */
    const PASSWORD = "Sarah2026";

    const form = document.getElementById("login-form");
    const passwordInput = document.getElementById("password");
    const errorMessage = document.getElementById("error");

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      if (passwordInput.value === PASSWORD) {
        window.location.href = "student.html";
      } else {
        errorMessage.textContent = "Incorrect password. Please try again.";
        passwordInput.value = "";
        passwordInput.focus();
      }
    });
  </script>

</body>
</html>
```
